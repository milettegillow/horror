<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>horror</title>
<meta name="description" content="A private ledger of horror and gothic cinema - watched, waiting and banished.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕸️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

<!-- fixed page frame: corner filigree and the fog along the foot -->
<div class="frame" aria-hidden="true">
  <span class="frame-corner frame-corner--tl"><svg viewBox="0 0 130 130"><use href="#orn-corner"/></svg></span>
  <span class="frame-corner frame-corner--tr"><svg viewBox="0 0 130 130"><use href="#orn-corner"/></svg></span>
  <span class="frame-corner frame-corner--bl"><svg viewBox="0 0 130 130"><use href="#orn-corner"/></svg></span>
  <span class="frame-corner frame-corner--br"><svg viewBox="0 0 130 130"><use href="#orn-corner"/></svg></span>
  <span class="fog"></span>
</div>

<!-- cobwebs, tucked into the top two corners of the page -->
<div class="webs" aria-hidden="true">
  <span class="web web--left"><svg viewBox="0 0 240 240"><use href="#orn-web"/></svg></span>
  <span class="web web--right"><svg viewBox="0 0 240 240"><use href="#orn-web"/></svg></span>
</div>

<a class="skip" href="#collection">Skip to the collection</a>

<header class="masthead">
  <span class="arch" aria-hidden="true"><svg viewBox="0 0 640 440" preserveAspectRatio="xMidYMin meet"><use href="#orn-arch"/></svg></span>
  <div class="masthead-inner">
    <h1 class="wordmark">horror</h1>
    <div class="rule rule--wide" aria-hidden="true">
      <span class="rule-line"></span>
      <span class="diamond"></span>
      <svg class="rule-fleur" viewBox="0 0 24 34"><use href="#orn-fleur"/></svg>
      <span class="diamond"></span>
      <span class="rule-line"></span>
    </div>
    <p class="tagline">A private ledger of the gothic - kept, watched and occasionally banished.</p>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Collection views">
  <!-- tab buttons rendered by script.js -->
</nav>

<main class="shell">
  <section id="collection" class="collection" role="tabpanel" aria-label="Collection">
    <!-- grid or placeholder rendered by script.js -->
  </section>

  <div class="rule rule--foot" aria-hidden="true">
    <span class="rule-line"></span>
    <span class="diamond"></span>
    <svg class="rule-fleur" viewBox="0 0 24 34"><use href="#orn-fleur"/></svg>
    <span class="diamond"></span>
    <span class="rule-line"></span>
  </div>

  <footer class="colophon">
    <p>Fourteen entries, kept under glass.</p>
  </footer>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1">

    <span class="panel-corner panel-corner--tl" aria-hidden="true"><svg viewBox="0 0 130 130"><use href="#orn-corner"/></svg></span>
    <span class="panel-corner panel-corner--tr" aria-hidden="true"><svg viewBox="0 0 130 130"><use href="#orn-corner"/></svg></span>
    <span class="panel-corner panel-corner--bl" aria-hidden="true"><svg viewBox="0 0 130 130"><use href="#orn-corner"/></svg></span>
    <span class="panel-corner panel-corner--br" aria-hidden="true"><svg viewBox="0 0 130 130"><use href="#orn-corner"/></svg></span>

    <button class="panel-close" id="panelClose" type="button">close</button>

    <p class="panel-eyebrow" id="panelEyebrow">Entry</p>
    <h2 class="panel-title" id="panelTitle"></h2>
    <p class="panel-sub" id="panelSub"></p>

    <div class="rule" aria-hidden="true">
      <span class="rule-line"></span>
      <span class="diamond"></span>
      <svg class="rule-fleur" viewBox="0 0 24 34"><use href="#orn-fleur"/></svg>
      <span class="diamond"></span>
      <span class="rule-line"></span>
    </div>

    <div class="field">
      <span class="field-label" id="statusLabel">Standing</span>
      <div class="segmented" id="statusGroup" role="group" aria-labelledby="statusLabel"></div>
    </div>

    <div class="field">
      <span class="field-label" id="enjoymentLabel">How much I liked it</span>
      <div class="rating" id="enjoymentGroup" data-rating="enjoyment" role="group" aria-labelledby="enjoymentLabel"></div>
    </div>

    <div class="field">
      <span class="field-label" id="fearLabel">How scary it was</span>
      <div class="rating" id="fearGroup" data-rating="fear" role="group" aria-labelledby="fearLabel"></div>
    </div>

    <div class="field">
      <label class="field-label" for="yearWatched">Year watched</label>
      <input class="text-input" id="yearWatched" type="text" inputmode="numeric" autocomplete="off" placeholder="unrecorded">
    </div>

    <div class="field">
      <label class="field-label" for="review">Review</label>
      <textarea class="text-area" id="review" rows="6" placeholder="Write it down before it fades."></textarea>
    </div>

    <p class="panel-foot">Held in memory only. A refresh returns everything to its original state.</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
